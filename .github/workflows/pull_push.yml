name: Maven Build and Run Tests 

on:
  push:
    branches: 
      - main
      - page-objects
  pull_request:
    branches: 
      - main
      - page-objects

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        problem-matcher: true
    - name: Build with Maven
      env:
         VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_PRODMODE_CI_SERVER_KEY }}
      run: ./mvnw -B clean package -Pproduction --file pom.xml -DskipTests

    #- name: Run unit tests only
    #  env:
    #     VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_PRODMODE_CI_SERVER_KEY }}
    #  run: ./mvnw -B verify -Pproduction --file pom.xml

    - name: Run tests
      env:
         VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_PRODMODE_CI_SERVER_KEY }}
      run: ./mvnw -B verify -Pproduction,it --file pom.xml -Dcom.vaadin.testbench.Parameters.chromeOptions="--headless --disable-gpu"
